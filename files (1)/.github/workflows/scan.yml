name: Deeplink Parameter Scan

on:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"  # 每日 02:23 UTC (可调整)

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run scan (API mode)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m org_scanner.main --org Skyscanner --mode api --output-dir reports --concurrency 8

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: deeplink-scan-reports
          path: reports/

